name: Etsy price refresh (weekly)

on:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday 7 AM UTC -- an hour after the Mouser job so they don't compete for the same runner window
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: weekly-refresh-etsy
  cancel-in-progress: false

jobs:
  refresh-etsy:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # this can run long with many items + delays

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Refresh Etsy item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          APIFY_ETSY_ACTOR_ID: ${{ secrets.APIFY_ETSY_ACTOR_ID }}
          APIFY_PUPPETEER_ACTOR_ID: ${{ secrets.APIFY_PUPPETEER_ACTOR_ID }}
        run: python scraper/actions_refresh_etsy_weekly.py
