name: Nightly price refresh

on:
  schedule:
    - cron: "0 0 * * *"   # 12:00 AM UTC daily -- adjust for your timezone if needed
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # many items to loop through; still shouldn't hang forever
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt psycopg2-binary==2.9.9

      - name: Refresh all item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_PUPPETEER_ACTOR_ID: ${{ secrets.APIFY_PUPPETEER_ACTOR_ID }}
        run: python scraper/actions_refresh_all.py
