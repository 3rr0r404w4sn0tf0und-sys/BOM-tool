name: Price refresh - other items (per-user interval)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min -- the actual per-source, per-user cadence is now controlled from Settings (user_scrape_settings), this is just the finest granularity that allows
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab too

permissions:
  contents: read

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # many items to loop through; still shouldn't hang forever
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Refresh all item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
        run: python scraper/actions_refresh_all.py
