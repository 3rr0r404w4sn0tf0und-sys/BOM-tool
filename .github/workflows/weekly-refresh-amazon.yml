name: Price refresh - Amazon (per-user interval)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min -- the actual per-source, per-user cadence is now controlled from Settings (user_scrape_settings), this is just the finest granularity that allows
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: weekly-refresh-amazon
  cancel-in-progress: false

jobs:
  refresh-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # this can run long with many items + delays
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Refresh Amazon item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          APIFY_AMAZON_ACTOR_ID: ${{ secrets.APIFY_AMAZON_ACTOR_ID }}
        run: python scraper/actions_refresh_amazon_weekly.py
