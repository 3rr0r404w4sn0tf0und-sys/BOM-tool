name: Amazon price refresh (biweekly)

on:
  schedule:
    - cron: "0 0 1,15 * *"   # Midnight UTC on the 1st and 15th of each month (~every 2 weeks)
  workflow_dispatch: {}

jobs:
  refresh-amazon:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # this can run long with many items + delays
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt psycopg2-binary==2.9.9

      - name: Refresh Amazon item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          APIFY_AMAZON_ACTOR_ID: ${{ secrets.APIFY_AMAZON_ACTOR_ID }}
        run: python scraper/actions_refresh_amazon_weekly.py
