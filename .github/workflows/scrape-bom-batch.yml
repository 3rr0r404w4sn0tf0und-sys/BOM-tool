name: Scrape BOM batch on demand

on:
  repository_dispatch:
    types: [bom-batch-scrape-request]

permissions:
  contents: read

concurrency:
  group: scrape-bom-${{ github.event.client_payload.bom_id }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # one run covers a whole BOM's worth of items
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape every matching item in this BOM
        env:
          BOM_ID: ${{ github.event.client_payload.bom_id }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          FILTER: ${{ github.event.client_payload.filter }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTERNAL_SCRAPE_SECRET: ${{ secrets.INTERNAL_SCRAPE_SECRET }}
          # Not actually sensitive (it's the same host baked into every public
          # iframe URL) -- default it so a missing secret can't silently break
          # the callback/credential fetch. secrets.API_PUBLIC_URL still wins if
          # you ever set it, e.g. to point at a staging deploy.
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL || 'https://bom-tool-ampf.onrender.com' }}
          APIFY_AMAZON_ACTOR_ID: ${{ secrets.APIFY_AMAZON_ACTOR_ID }}
          APIFY_PUPPETEER_ACTOR_ID: ${{ secrets.APIFY_PUPPETEER_ACTOR_ID }}
          APIFY_MOUSER_ACTOR_ID: ${{ secrets.APIFY_MOUSER_ACTOR_ID }}
        run: python scraper/actions_refresh_bom_batch.py
