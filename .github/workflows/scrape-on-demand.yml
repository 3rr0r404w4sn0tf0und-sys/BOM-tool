name: Scrape price on demand

on:
  repository_dispatch:
    types: [scrape-request]

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8  # single item -- should never legitimately take this long
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt psycopg2-binary==2.9.9

      - name: Scrape and report result
        env:
          ITEM_ID: ${{ github.event.client_payload.item_id }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          URL: ${{ github.event.client_payload.url }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          INTERNAL_SCRAPE_SECRET: ${{ secrets.INTERNAL_SCRAPE_SECRET }}
          APIFY_TOKEN: ${{ github.event.client_payload.apify_token }}
          APIFY_AMAZON_ACTOR_ID: ${{ secrets.APIFY_AMAZON_ACTOR_ID }}
          APIFY_PUPPETEER_ACTOR_ID: ${{ secrets.APIFY_PUPPETEER_ACTOR_ID }}
        run: python scraper/actions_scrape_one.py
