name: Mouser price refresh (weekly)

on:
  schedule:
    # Every Monday 6 AM UTC. Previously "1,15 * *" (biweekly) despite the
    # name/docstring saying weekly, and despite the 3-day dedupe window
    # below only making sense for an actual weekly cadence -- fixed to
    # match the stated intent.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: weekly-refresh-mouser
  cancel-in-progress: false

jobs:
  refresh-mouser:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # this can run long with many items + delays

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Refresh Mouser item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          APIFY_MOUSER_ACTOR_ID: ${{ secrets.APIFY_MOUSER_ACTOR_ID }}
        run: python scraper/actions_refresh_mouser_weekly.py
