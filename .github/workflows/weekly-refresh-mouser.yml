name: Mouser price refresh (biweekly)

on:
  schedule:
    - cron: "0 6 1,15 * *"   # 6 AM UTC on the 1st and 15th -- offset from the Amazon job (midnight) so they don't compete for the same runner window
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: weekly-refresh-mouser
  cancel-in-progress: false

jobs:
  refresh-mouser:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # this can run long with many items + delays

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt

      - name: Refresh Mouser item prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          APIFY_MOUSER_ACTOR_ID: ${{ secrets.APIFY_MOUSER_ACTOR_ID }}
          APIFY_PUPPETEER_ACTOR_ID: ${{ secrets.APIFY_PUPPETEER_ACTOR_ID }}
        run: python scraper/actions_refresh_mouser_weekly.py
