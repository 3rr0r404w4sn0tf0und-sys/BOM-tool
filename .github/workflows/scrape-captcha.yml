name: Scrape with CAPTCHA hand-off

on:
  repository_dispatch:
    types: [captcha-scrape-request]

permissions:
  contents: read

concurrency:
  group: scrape-item-${{ github.event.client_payload.item_id }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # covers the up-to-10-min wait for a human to solve it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium

      - name: Scrape, wait for CAPTCHA solve if needed
        env:
          ITEM_ID: ${{ github.event.client_payload.item_id }}
          URL: ${{ github.event.client_payload.url }}
          API_BASE_URL: ${{ github.event.client_payload.api_base_url }}
          INTERNAL_SCRAPE_SECRET: ${{ secrets.INTERNAL_SCRAPE_SECRET }}
        run: python scraper/actions_scrape_captcha.py
