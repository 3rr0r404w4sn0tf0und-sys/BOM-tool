<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BOM Tool</title>
    <!-- Same-origin file rather than an inline script, so it runs under
         this app's `script-src 'self'` CSP (see vercel.json) without a
         nonce. Must stay above the stylesheet/app bundle so data-theme
         is set before anything themed paints. -->
    <script src="/theme-init.js"></script>
    <style>
      html, body { margin: 0; padding: 0; }
      html { background: #f7f4ef; }
      html[data-theme="dark"] { background: #0b1020; }
      html[data-theme="dark"] body { background: #0b1020; }
      #root { min-height: 100vh; }
      body, #root, * {
        transition: background-color 500ms ease, border-color 500ms ease, color 500ms ease, box-shadow 500ms ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
